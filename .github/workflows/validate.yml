name: Validate agent kit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -X utf8 scripts/validate.py
      - run: python -B -X utf8 scripts/test_install.py
      - run: python -B -X utf8 .agents/harness/validation/test_sync.py
      - run: python -B -X utf8 .agents/harness/validation/test_loop.py
      - run: python -B -X utf8 .agents/harness/validation/test_writing.py
